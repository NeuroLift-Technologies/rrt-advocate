# RRT AIdvocAIte Configuration (Solidarity Framework Protective Layer)
# Local-first, TOI/OTOI-driven orchestration.

metadata:
  version: "2.0"
  deprecations:
    - "Legacy 1D Green->Black severity routing is deprecated for persona-first routing."
  local_first_required: true

toi_defaults:
  tone_profile: supportive_default
  pacing: gentle
  cognitive_scaffolding: moderate
  safety_boundaries:
    require_consent_before_activation: true
    disallowed_response_patterns: []
    allow_external_escalation_without_consent: false

otoi_policy:
  max_persona_weight: 0.70
  min_active_personas: 2

tone_profiles:
  supportive_default:
    style: "Warm, validating"
  minimal:
    style: "Extremely concise, low cognitive load"
  directive:
    style: "Clear, action-oriented"
  therapeutic_reflective:
    style: "Empathic mirroring and gentle reflection"

tiered_activation:
  stage_0:
    name: "Observe"
    behavior: "Passive local monitoring only"
  stage_1:
    name: "Consent entry"
    prompt: "I can activate your RRT support mode now. Would you like me to do that? (yes/no)"
  stage_2:
    name: "Distress flavor check"
    inputs:
      everything_hurts_meltdown:
        labels: ["Everything hurts / Meltdown", "meltdown", "everything hurts"]
        weights:
          ASH: 0.45
          MYRA: 0.45
          SOL: 0.05
          ECHO: 0.03
          KAI: 0.02
        silent_mode: false
      cant_do_basic_tasks:
        labels: ["Can't do basic tasks", "cant do basic tasks", "can't start"]
        weights:
          SOL: 0.65
          ASH: 0.15
          MYRA: 0.10
          ECHO: 0.05
          KAI: 0.05
        silent_mode: false
      cant_stop_self_blame:
        labels: ["Can't stop self-blame", "self-blame", "my fault"]
        weights:
          ECHO: 0.65
          ASH: 0.20
          MYRA: 0.10
          SOL: 0.03
          KAI: 0.02
        silent_mode: false
      stuck_in_hyperfocus_loop:
        labels: ["Stuck in hyperfocus/loop", "hyperfocus", "looping"]
        weights:
          KAI: 0.65
          SOL: 0.15
          MYRA: 0.10
          ASH: 0.05
          ECHO: 0.05
        silent_mode: false
      dont_know_shutdown:
        labels: ["Don't know / Shut down", "shutdown", "dont know", "blank"]
        weights:
          MYRA: 0.75
          ASH: 0.15
          SOL: 0.05
          ECHO: 0.03
          KAI: 0.02
        silent_mode: true
        silent_mode_rules:
          calm_visual_language: true
          timers_forbidden: true
  stage_3:
    name: "Guided support"
  stage_4:
    name: "Stabilization"
  stage_5:
    name: "Follow-through + optional escalation"

persona_profiles:
  ASH: "Validates burnout, diffuses shame, prioritizes being over doing."
  SOL: "Scaffolds executive function and lowers activation energy for tasks."
  ECHO: "Mirrors internal monologue and reframes distortions."
  KAI: "Redirects hyperfocus loops into safer constructive channels."
  MYRA: "Provides relational safety, co-regulation, and non-verbal anchoring."

crisis_detection_engine:
  local_processing_only: true
  layers:
    layer_1_keyword_semantic:
      domains:
        negative_self_talk:
          examples: ["worthless", "broken", "hate myself", "my fault", "shame"]
        task_avoidance:
          examples: ["can't start", "stuck", "frozen", "avoiding"]
        overwhelm:
          examples: ["overwhelmed", "everything hurts", "meltdown", "shutdown"]
    layer_2_sentiment_tone:
      track:
        - polarity
        - polarity_drop
        - negative_word_density
    layer_3_behavioral_patterns:
      track:
        - response_latency
        - message_complexity
        - looping_behavior
  scoring:
    layer_1_weight: 0.42
    layer_2_weight: 0.33
    layer_3_weight: 0.25

guardrails:
  anti_gaslight_shame_resistant_language: true
  no_forced_productivity_in_burnout_or_shutdown: true
  agency_first: true
  require_stage_1_consent: true
