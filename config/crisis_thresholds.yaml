protective_layer:
  framework_name: "HAIEF Solidarity Framework"
  protective_role: "RRT AIdvocAIte"
  local_processing_only: true
  encrypted_storage: true
  user_agency_first: true
  notes:
    - "The CDE must remain local-first and never require cloud analysis."
    - "TOI is a hard middleware contract, not an advisory preference."
    - "Burnout is not treated as a productivity failure."

  risk_bands:
    green: [0.0, 0.24]
    yellow: [0.24, 0.45]
    orange: [0.45, 0.7]
    red: [0.7, 0.88]
    black: [0.88, 1.0]

  tone_profiles:
    supportive_default:
      label: "Supportive Default"
      max_sentences: 4
      instructions:
        - "Use warm, validating language."
        - "Keep cognitive load low."
        - "Avoid shame, blame, and pressure."
    minimal:
      label: "Minimal Tone"
      max_sentences: 2
      instructions:
        - "Be extremely concise."
        - "Use the fewest words that still feel safe."
        - "Prefer statements over questions."
    directive:
      label: "Directive Tone"
      max_sentences: 4
      instructions:
        - "Use short action steps."
        - "Make the next move concrete and visible."
        - "Do not sound militaristic or shaming."
    therapeutic_reflective:
      label: "Therapeutic / Reflective Tone"
      max_sentences: 4
      instructions:
        - "Mirror the emotional reality without overexplaining."
        - "Use soft, optional questions."
        - "Center regulation before problem-solving."

  dialogue_tree:
    stage_1_entry_prompt: "I can switch into RRT AIdvocAIte mode and keep this low-demand. Want me to do that now?"
    stage_2_prompt: "Which of these fits best right now?"
    stage_4_follow_up: "Do you want to stay low-demand, get one concrete next step, or pause here?"
    stage_5_consent_to_escalate: "This looks heavier. Do you want help reaching an external support option right now?"
    stage_2_options:
      meltdown:
        label: "Everything hurts / Meltdown"
        tone_bias: therapeutic_reflective
        silent_mode: false
        weights:
          ash: 0.42
          sol: 0.06
          echo: 0.10
          kai: 0.05
          myra: 0.37
      task_paralysis:
        label: "Can't do basic tasks"
        tone_bias: directive
        silent_mode: false
        weights:
          ash: 0.10
          sol: 0.54
          echo: 0.08
          kai: 0.10
          myra: 0.18
      self_blame:
        label: "Can't stop self-blame"
        tone_bias: therapeutic_reflective
        silent_mode: false
        weights:
          ash: 0.18
          sol: 0.05
          echo: 0.52
          kai: 0.05
          myra: 0.20
      hyperfocus_loop:
        label: "Stuck in hyperfocus/loop"
        tone_bias: directive
        silent_mode: false
        weights:
          ash: 0.08
          sol: 0.14
          echo: 0.08
          kai: 0.52
          myra: 0.18
      shutdown:
        label: "Don't know / Shut down"
        tone_bias: minimal
        silent_mode: true
        weights:
          ash: 0.22
          sol: 0.08
          echo: 0.06
          kai: 0.04
          myra: 0.60

  persona_adjustments:
    semantic_fields:
      negative_self_talk:
        echo: 0.12
        ash: 0.05
      task_avoidance:
        sol: 0.14
      overwhelm:
        ash: 0.10
        myra: 0.12
      hyperfocus_loop:
        kai: 0.16
      shutdown:
        myra: 0.18
    high_sentiment_drop:
      ash: 0.06
      echo: 0.04
      myra: 0.06
    high_behavioral_risk:
      sol: 0.05
      myra: 0.10

  cde:
    layer_weights:
      semantic: 0.45
      sentiment: 0.35
      behavioral: 0.20
    semantic_fields:
      negative_self_talk:
        - "i'm a failure"
        - "im a failure"
        - "my fault"
        - "hate myself"
        - "worthless"
        - "broken"
        - "useless"
        - "ashamed"
      task_avoidance:
        - "can't start"
        - "cant start"
        - "can't do basic tasks"
        - "cant do basic tasks"
        - "can't begin"
        - "cant begin"
        - "paralyzed"
        - "frozen"
      overwhelm:
        - "everything hurts"
        - "meltdown"
        - "too much"
        - "overwhelmed"
        - "can't think"
        - "cant think"
        - "flooded"
      hyperfocus_loop:
        - "hyperfocus"
        - "looping"
        - "doomscroll"
        - "spiraling"
        - "replaying"
        - "can't stop"
        - "cant stop"
      shutdown:
        - "shut down"
        - "shutdown"
        - "don't know"
        - "dont know"
        - "blank"
        - "gone quiet"
    sentiment_lexicon:
      negative:
        - "bad"
        - "hate"
        - "stuck"
        - "panic"
        - "ashamed"
        - "overwhelmed"
        - "failing"
        - "broken"
        - "worthless"
      positive:
        - "okay"
        - "safe"
        - "calm"
        - "steady"
        - "manageable"
      intensifiers:
        - "very"
        - "so"
        - "too"
        - "completely"
        - "never"
        - "always"
    behavioral_thresholds:
      latency_seconds:
        yellow: 45
        orange: 120
        red: 240
      low_complexity_word_count: 4
      shutdown_word_count: 3
      looping_similarity_ratio: 0.72
    immediate_safety_keywords:
      - "i am not safe"
      - "i want to disappear"
      - "i might hurt myself"
      - "i want to die"
      - "i can't stay safe"

  escalation:
    consent_required: true
    external_support_requires_explicit_opt_in: true
    supervisor_notification_levels:
      - "orange"
      - "red"
      - "black"
