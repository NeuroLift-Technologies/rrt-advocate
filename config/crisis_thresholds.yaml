# =============================================================================
# Crisis Detection Engine (CDE) Configuration
# RRT AIdvocAIte — Protective Layer of the Solidarity Framework
# =============================================================================
#
# This config governs the 3-layer, local-first CDE pipeline.
# All processing happens on-device.  No data is transmitted externally.

# =============================================================================
# CRISIS LEVEL DEFINITIONS (derived from CDE aggregate distress score)
# =============================================================================

crisis_levels:
  green:
    name: "Stable"
    description: "Normal functioning, no intervention required"
    threshold_range: [0.0, 0.15]
    monitoring_interval: 5

  yellow:
    name: "Elevated"
    description: "Mild distress signals detected; passive observation continues"
    threshold_range: [0.15, 0.35]
    monitoring_interval: 3

  orange:
    name: "High"
    description: "Significant distress; Entry Prompt (Stage 1) may be triggered"
    threshold_range: [0.35, 0.60]
    monitoring_interval: 1

  red:
    name: "Critical"
    description: "Acute distress; full Fusion Engine engagement recommended"
    threshold_range: [0.60, 0.85]
    monitoring_interval: 0.5

  black:
    name: "Emergency"
    description: "Severe crisis; all personas active, escalation considered"
    threshold_range: [0.85, 1.0]
    monitoring_interval: 0.1

# =============================================================================
# CDE LAYER WEIGHTS
# =============================================================================

cde_layer_weights:
  keyword_semantic: 0.40
  sentiment_tone: 0.30
  behavioral_pattern: 0.30

# =============================================================================
# LAYER 1 — KEYWORD / SEMANTIC FIELD CONFIGURATION
# =============================================================================

keyword_fields:
  negative_self_talk:
    weight: 0.25
    description: "Self-directed blame, shame, and hopelessness language"
  task_avoidance:
    weight: 0.20
    description: "Language signalling paralysis or inability to begin tasks"
  overwhelm:
    weight: 0.25
    description: "Expressions of being flooded, melting down, or shutting down"
  hyperfocus_loop:
    weight: 0.15
    description: "Signals of being stuck in unproductive fixation cycles"
  relational_distress:
    weight: 0.15
    description: "Rejection sensitivity, isolation, relational pain"

# =============================================================================
# LAYER 2 — SENTIMENT / EMOTIONAL TONE
# =============================================================================

sentiment_config:
  window_size: 10
  polarity_drop_threshold: 0.40
  volatility_threshold: 0.50

# =============================================================================
# LAYER 3 — BEHAVIORAL PATTERN
# =============================================================================

behavioral_config:
  window_size: 20
  latency_weight: 0.30
  complexity_weight: 0.30
  looping_weight: 0.40

# =============================================================================
# ACTIVATION THRESHOLDS
# =============================================================================

activation:
  cde_trigger_threshold: 0.20
  entry_prompt_threshold: 0.35

# =============================================================================
# PRIVACY & SECURITY
# =============================================================================

privacy_settings:
  local_processing_only: true
  encrypted_storage: true
  data_retention_days: 30
  anonymous_reporting: true
  user_consent_required: true

security_settings:
  crisis_log_encryption: "AES-256"
  communication_encryption: "end-to-end"
  access_control: "user-only"
  audit_logging: true

# =============================================================================
# ESCALATION (consent-gated)
# =============================================================================

escalation_rules:
  automatic_escalation:
    safety_score_threshold: 0.3
    crisis_duration_threshold: 30
    intervention_failure_count: 3
  supervisor_notification:
    crisis_levels: ["orange", "red", "black"]
    user_consent_required: true
  external_resource_activation:
    crisis_levels: ["red", "black"]
    user_consent_required: true
  emergency_contacts:
    crisis_levels: ["black"]
    user_consent_required: true
