# RRT Advocate Protective Layer Configuration
# Solidarity Framework - TOI/OTOI + Persona Fusion + 3-layer CDE

privacy_settings:
  local_processing_only: true
  cloud_fallback_enabled: false

toi_defaults:
  tone_profile: supportive_default
  pacing: steady
  cognitive_scaffolding: moderate
  safety_boundaries:
    - "No shaming language"
    - "Ask for consent before escalation"
  allowed_personas: [ash, sol, echo, kai, myra]
  max_personas_per_turn: 2

otoi:
  strict_persona_contract: true
  allow_persona_override: false

tone_profiles:
  supportive_default:
    prompt_directive: "Warm, validating, and shame-resistant language."
    max_sentences: 4
    sentence_style: "gentle"
  minimal:
    prompt_directive: "Extremely concise, lowest possible cognitive load."
    max_sentences: 2
    sentence_style: "brief"
  directive:
    prompt_directive: "Clear, action-oriented language suitable for Sol/Kai."
    max_sentences: 3
    sentence_style: "instructional"
  therapeutic_reflective:
    prompt_directive: "Empathetic mirroring and soft Socratic reflection."
    max_sentences: 5
    sentence_style: "reflective"

persona_fusion:
  base_weights:
    ash: 0.20
    sol: 0.20
    echo: 0.20
    kai: 0.20
    myra: 0.20

  # Stage-2 distress input -> dynamic fusion boosts
  stage2_mapping:
    "everything hurts / meltdown":
      persona_boosts:
        ash: 0.75
        myra: 0.75
      silent_mode: false

    "can't do basic tasks":
      persona_boosts:
        sol: 1.25
      silent_mode: false

    "can't stop self-blame":
      persona_boosts:
        echo: 1.25
      silent_mode: false

    "stuck in hyperfocus/loop":
      persona_boosts:
        kai: 1.25
      silent_mode: false

    "don't know / shut down":
      persona_boosts:
        myra: 1.40
      silent_mode: true

  high_risk_myra_boost: 0.25
  high_risk_ash_boost: 0.15

cde:
  local_processing_only: true

  layer_weights:
    layer1: 0.40
    layer2: 0.30
    layer3: 0.30

  layer1:
    keyword_libraries:
      negative_self_talk:
        - "i hate myself"
        - "worthless"
        - "failure"
        - "it's all my fault"
        - "broken"
      task_avoidance:
        - "can't start"
        - "can't do"
        - "avoiding everything"
        - "stuck"
        - "shutdown"
      overwhelm:
        - "everything hurts"
        - "meltdown"
        - "too much"
        - "can't cope"
        - "flooded"
    weights:
      negative_self_talk: 0.35
      task_avoidance: 0.30
      overwhelm: 0.35

  layer2:
    polarity_drop_threshold: 0.25
    lexicon:
      negative:
        - "hopeless"
        - "numb"
        - "panic"
        - "ashamed"
        - "stuck"
        - "overwhelmed"
      positive:
        - "okay"
        - "safe"
        - "hopeful"
        - "calm"
        - "steady"

  layer3:
    thresholds:
      response_latency_seconds: 45
      min_avg_tokens: 4
      looping_similarity: 0.75

activation_dialogue:
  stage_1_prompt: "I can activate RRT support now. Do you want me to start? Reply yes/no."
  stage_2_options:
    - "everything hurts / meltdown"
    - "can't do basic tasks"
    - "can't stop self-blame"
    - "stuck in hyperfocus/loop"
    - "don't know / shut down"
  stage_5_resources:
    - "US Suicide & Crisis Lifeline: 988"
    - "Crisis Text Line: text HOME to 741741"
