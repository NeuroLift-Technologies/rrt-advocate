version: 2
activation_stages:
  stage_0:
    label: "Passive check-in"
    purpose: "Observe activation without pushing for action."
  stage_1:
    label: "Entry prompt"
    purpose: "Ask for consent before the advocate fully engages."
  stage_2:
    label: "Distress sort"
    purpose: "Let the user name the distress flavor with minimal demand."
  stage_3:
    label: "Regulation support"
    purpose: "Deliver the persona blend and a low-demand next step."
  stage_4:
    label: "Stabilization"
    purpose: "Check whether the load is easing or needs another pass."
  stage_5:
    label: "Escalation"
    purpose: "Offer a higher-support path while preserving consent."

stage_2_distress_map:
  "Everything hurts / Meltdown":
    persona_weights:
      ash: 0.42
      myra: 0.36
      sol: 0.10
      echo: 0.07
      kai: 0.05
    silent_mode: false
    response_focus:
      - "Reduce demands for the next few minutes."
      - "Move to the lowest-stimulation space available."
      - "Release jaw, shoulders, and hands without using a timer."
  "Can't do basic tasks":
    persona_weights:
      ash: 0.12
      myra: 0.10
      sol: 0.50
      echo: 0.08
      kai: 0.20
    silent_mode: false
    response_focus:
      - "Shrink the task until it feels almost too small."
      - "Put only the next object in reach."
      - "Stop after one completed micro-step if needed."
  "Can't stop self-blame":
    persona_weights:
      ash: 0.18
      myra: 0.10
      sol: 0.07
      echo: 0.55
      kai: 0.10
    silent_mode: false
    response_focus:
      - "Name one fact without judging it."
      - "Replace 'should' with 'right now is hard'."
      - "Delay self-evaluation until your system is steadier."
  "Stuck in hyperfocus/loop":
    persona_weights:
      ash: 0.08
      myra: 0.08
      sol: 0.22
      echo: 0.07
      kai: 0.55
    silent_mode: false
    response_focus:
      - "Pick one exit point from the loop."
      - "Change visual context so the fixation is not centered."
      - "Route the energy into one bounded next action."
  "Don't know / Shut down":
    persona_weights:
      ash: 0.18
      myra: 0.62
      sol: 0.08
      echo: 0.04
      kai: 0.08
    silent_mode: true
    response_focus:
      - "Silent mode on. No timers."
      - "Use one nearby sensory anchor."
      - "Keep language optional until words come back."

risk_thresholds:
  steady: [0.0, 0.25]
  activated: [0.25, 0.50]
  crisis: [0.50, 0.75]
  acute: [0.75, 1.00]

cde:
  layer_weights:
    semantic: 0.45
    sentiment: 0.30
    behavioral: 0.25
  layer_1:
    lexicons:
      negative_self_talk:
        - "i'm a failure"
        - "useless"
        - "broken"
        - "my fault"
        - "hate myself"
        - "can't do anything"
      task_avoidance:
        - "can't start"
        - "can't do basic tasks"
        - "avoid"
        - "stalled"
        - "frozen"
        - "can't initiate"
      overwhelm:
        - "everything hurts"
        - "too much"
        - "overwhelmed"
        - "meltdown"
        - "panic"
        - "flooded"
      hyperfocus_loop:
        - "can't stop"
        - "loop"
        - "hyperfocus"
        - "spiraling"
        - "stuck on this"
        - "can't switch"
      shutdown:
        - "don't know"
        - "shut down"
        - "blank"
        - "no words"
        - "numb"
        - "gone"
  layer_2:
    negative_terms:
      - "bad"
      - "stuck"
      - "ashamed"
      - "panic"
      - "scared"
      - "overwhelmed"
      - "hopeless"
      - "failing"
    positive_terms:
      - "okay"
      - "safe"
      - "steady"
      - "calm"
      - "manageable"
      - "grounded"
    intense_terms:
      - "meltdown"
      - "spiraling"
      - "flooded"
      - "crashing"
