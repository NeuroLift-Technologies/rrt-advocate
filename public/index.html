<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RRT AIdvocAIte</title>
    <style>
      :root {
        --bg: #f7f7fb;
        --panel: #ffffff;
        --ink: #1e2430;
        --muted: #697386;
        --line: #d9dee8;
        --accent: #0f766e;
        --accent-strong: #115e59;
        --user: #e7f6f4;
        --assistant: #f0f2f7;
        --critical: #b42318;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--bg);
      }

      main {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
        min-height: 100vh;
      }

      aside {
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
        line-height: 1.2;
      }

      .tagline {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.45;
      }

      .persona-list {
        display: grid;
        gap: 8px;
      }

      .persona {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: var(--accent);
      }

      .chat-shell {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      .status-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.78);
      }

      .status-pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
      }

      .status-pill.critical {
        border-color: #f5c2bd;
        color: var(--critical);
      }

      #chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px;
      }

      .message {
        width: min(760px, 92%);
        margin: 0 0 14px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .user-message {
        margin-left: auto;
        background: var(--user);
      }

      .assistant-message {
        background: var(--assistant);
      }

      .input-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        border-top: 1px solid var(--line);
        background: var(--panel);
        padding: 14px 20px;
      }

      textarea {
        width: 100%;
        max-height: 160px;
        min-height: 46px;
        resize: none;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        color: var(--ink);
        font: inherit;
      }

      button {
        min-width: 92px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--accent-strong);
      }

      button:disabled {
        background: #8d99ae;
        cursor: wait;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        aside {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          padding: 18px 20px;
        }

        .persona-list {
          grid-template-columns: repeat(5, minmax(0, 1fr));
        }

        .persona {
          align-items: flex-start;
          gap: 6px;
          font-size: 0.78rem;
        }

        .input-row {
          grid-template-columns: 1fr;
        }

        button {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <aside>
        <h1>RRT AIdvocAIte</h1>
        <p class="tagline">A calm, consent-led assistant for burnout, overwhelm, shutdown, and task paralysis.</p>
        <div class="persona-list" aria-label="RRT personas">
          <div class="persona"><span class="dot"></span><span>Ash</span></div>
          <div class="persona"><span class="dot"></span><span>Sol</span></div>
          <div class="persona"><span class="dot"></span><span>Echo</span></div>
          <div class="persona"><span class="dot"></span><span>Kai</span></div>
          <div class="persona"><span class="dot"></span><span>Myra</span></div>
        </div>
      </aside>
      <section class="chat-shell" aria-label="RRT AIdvocAIte chat">
        <div class="status-bar">
          <span>Protective Layer</span>
          <span id="risk-status" class="status-pill" role="status" aria-live="polite" aria-atomic="true">local pre-check: stable</span>
        </div>
        <div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions text">
          <div class="message assistant-message">I'm here. We can go slow. Tell me what is happening, and I will meet you where you are.</div>
        </div>
        <div class="input-row">
          <textarea id="user-input" aria-label="Describe what is happening" rows="1" placeholder="Type what is happening..."></textarea>
          <button id="send-button">Send</button>
        </div>
      </section>
    </main>
    <script src="chat.js"></script>
  </body>
</html>
